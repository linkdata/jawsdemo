{{with .Dot}}
<div class="row m-2 border rounded-pill border-secondary bg-light">
	<div class="col col-10">
		<a href="/" class="text-decoration-none text-body text-nowrap">
			<img src="{{.FaviconURI}}" height="16px" class="mb-1">
			jawsdemo
			<span class="text-secondary">{{.JawsVersion}}</span>
			{{$.Span .ClientPos `class="text-info"`}}
		</a>
	</div>
	{{$.Div .Clock `class="col col-2 text-body text-end"`}}
</div>

<!--
	JsVarStore binds the live window.runtime and window.client variables.
	The bindings render once in the page, outside updated UI regions.
	jawsVar('client') sends the current browser value after direct mutations;
	jawsVar('client.X', value) sends and applies one field change.
-->
{{$.NewUI (.RuntimeBinding)}}
{{$.NewUI (.ClientBinding $.Element.Request)}}

{{end}}
